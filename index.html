<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morpa Launcher</title>
<link rel="icon" href="icon.png">
<style>
  :root { --bg: #f7f6fb; --text: #1d1b2e; --muted: #5b5872; --accent: #2a2466; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14122a; --text: #ecebf5; --muted: #a9a6c2; --accent: #b9b2ff; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
  main { padding: 32px 20px; max-width: 520px; }
  img { width: 112px; height: 112px; border-radius: 28px; }
  h1 { font-size: 30px; margin: 18px 0 6px; }
  p { color: var(--muted); margin: 0 0 22px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="Morpa Launcher icon">
  <h1>Morpa Launcher</h1>
  <p>A home screen for Android that changes its whole look with themes.</p>
  <p><a href="privacy/">Privacy Policy</a> · <a href="mailto:morpalauncher@gmail.com">Contact</a></p>
</main>
</body>
</html>
